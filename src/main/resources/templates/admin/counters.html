<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Counters - digitalQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin">
                <span class="fw-bold">digital</span>Q Admin
            </a>
            <div class="navbar-nav flex-row">
                <a class="nav-link text-light me-3" href="/admin">Dashboard</a>
                <a class="nav-link text-light me-3" href="/admin/counters">Counters</a>
                <a class="nav-link text-light me-3" href="/admin/staff">Staff</a>
                <a class="nav-link text-light me-3" href="/admin/reports">Reports</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Manage Counters</h3>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createCounterModal">
                + New Counter
            </button>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Service Type</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="counter : ${counters}">
                                <td th:text="${counter.id}">1</td>
                                <td th:text="${counter.name}">Counter 1</td>
                                <td th:text="${counter.serviceType}">General</td>
                                <td>
                                    <span class="badge" th:classappend="${counter.active ? 'bg-success' : 'bg-secondary'}"
                                          th:text="${counter.active ? 'Active' : 'Inactive'}">Active</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-warning me-1"
                                            th:onclick="'toggleCounter(' + ${counter.id} + ', ' + ${!counter.active} + ')'"
                                            th:text="${counter.active ? 'Deactivate' : 'Activate'}">
                                        Deactivate
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Counter Modal -->
    <div class="modal fade" id="createCounterModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Counter</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createCounterForm">
                        <div class="mb-3">
                            <label for="counterName" class="form-label">Counter Name</label>
                            <input type="text" class="form-control" id="counterName" required>
                        </div>
                        <div class="mb-3">
                            <label for="serviceType" class="form-label">Service Type</label>
                            <input type="text" class="form-control" id="serviceType" required placeholder="e.g., Billing, Support">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createCounter()">Create</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin-counters.js}"></script>
</body>
</html>
