<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Staff - digitalQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin">
                <span class="fw-bold">digital</span>Q Admin
            </a>
            <div class="navbar-nav flex-row">
                <a class="nav-link text-light me-3" href="/admin">Dashboard</a>
                <a class="nav-link text-light me-3" href="/admin/counters">Counters</a>
                <a class="nav-link text-light me-3" href="/admin/staff">Staff</a>
                <a class="nav-link text-light me-3" href="/admin/reports">Reports</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Manage Staff</h3>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createStaffModal">
                + New Staff
            </button>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${staff}">
                                <td th:text="${s.id}">1</td>
                                <td th:text="${s.username}">staff1</td>
                                <td><span class="badge bg-info">Staff</span></td>
                                <td>
                                    <span class="badge" th:classappend="${s.active ? 'bg-success' : 'bg-secondary'}"
                                          th:text="${s.active ? 'Active' : 'Inactive'}">Active</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-warning me-1"
                                            th:onclick="'toggleStaff(' + ${s.id} + ', ' + ${!s.active} + ')'"
                                            th:text="${s.active ? 'Deactivate' : 'Activate'}">
                                        Deactivate
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Staff Modal -->
    <div class="modal fade" id="createStaffModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Staff Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createStaffForm">
                        <div class="mb-3">
                            <label for="staffUsername" class="form-label">Username</label>
                            <input type="text" class="form-control" id="staffUsername" required>
                        </div>
                        <div class="mb-3">
                            <label for="staffPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="staffPassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="staffCounter" class="form-label">Assign to Counter</label>
                            <select class="form-select" id="staffCounter">
                                <option value="">-- Select Counter --</option>
                                <option th:each="c : ${counters}" th:value="${c.id}" th:text="${c.name}">Counter 1</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createStaff()">Create</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin-staff.js}"></script>
</body>
</html>
