<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - digitalQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin">
                <span class="fw-bold">digital</span>Q Admin
            </a>
            <div class="navbar-nav flex-row">
                <a class="nav-link text-light me-3" href="/admin">Dashboard</a>
                <a class="nav-link text-light me-3" href="/admin/counters">Counters</a>
                <a class="nav-link text-light me-3" href="/admin/staff">Staff</a>
                <a class="nav-link text-light me-3" href="/admin/reports">Reports</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Stats Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-primary text-white shadow">
                    <div class="card-body text-center">
                        <h3 th:text="${stats.totalWaiting}">0</h3>
                        <p class="mb-0">Total Waiting</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white shadow">
                    <div class="card-body text-center">
                        <h3 th:text="${stats.totalServedToday}">0</h3>
                        <p class="mb-0">Served Today</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info text-white shadow">
                    <div class="card-body text-center">
                        <h3 th:text="${stats.activeCounters}">0</h3>
                        <p class="mb-0">Active Counters</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning text-dark shadow">
                    <div class="card-body text-center">
                        <h3 th:text="${#numbers.formatDecimal(stats.averageWaitTimeMinutes, 1, 1)}">0.0</h3>
                        <p class="mb-0">Avg Wait (min)</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Counter Details -->
        <div class="card shadow">
            <div class="card-header">
                <h5 class="mb-0">Counter Status</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Counter</th>
                                <th>Service</th>
                                <th>Status</th>
                                <th>Current Token</th>
                                <th>Waiting</th>
                                <th>Served Today</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cs : ${stats.counterStats}">
                                <td th:text="${cs.counterName}">Counter 1</td>
                                <td th:text="${cs.serviceType}">General</td>
                                <td>
                                    <span class="badge" th:classappend="${cs.active ? 'bg-success' : 'bg-secondary'}"
                                          th:text="${cs.active ? 'Active' : 'Inactive'}">Active</span>
                                    <span class="badge bg-warning ms-1" th:if="${cs.paused}">Paused</span>
                                </td>
                                <td th:text="${cs.currentToken != null ? cs.currentToken : '-'}">-</td>
                                <td th:text="${cs.waitingCount}">0</td>
                                <td th:text="${cs.servedToday}">0</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/admin-dashboard.js}"></script>
</body>
</html>
