<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - digitalQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin">
                <span class="fw-bold">digital</span>Q Admin
            </a>
            <div class="navbar-nav flex-row">
                <a class="nav-link text-light me-3" href="/admin">Dashboard</a>
                <a class="nav-link text-light me-3" href="/admin/counters">Counters</a>
                <a class="nav-link text-light me-3" href="/admin/staff">Staff</a>
                <a class="nav-link text-light me-3" href="/admin/reports">Reports</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h3 class="mb-4">Reports & Analytics</h3>

        <div class="row">
            <div class="col-md-6">
                <div class="card shadow mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">System Overview</h5>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <tr>
                                <td>Total Waiting</td>
                                <td class="text-end fw-bold" th:text="${stats.totalWaiting}">0</td>
                            </tr>
                            <tr>
                                <td>Total Served Today</td>
                                <td class="text-end fw-bold" th:text="${stats.totalServedToday}">0</td>
                            </tr>
                            <tr>
                                <td>Active Counters</td>
                                <td class="text-end fw-bold" th:text="${stats.activeCounters}">0</td>
                            </tr>
                            <tr>
                                <td>Total Counters</td>
                                <td class="text-end fw-bold" th:text="${stats.totalCounters}">0</td>
                            </tr>
                            <tr>
                                <td>Average Wait Time</td>
                                <td class="text-end fw-bold">
                                    <span th:text="${#numbers.formatDecimal(stats.averageWaitTimeMinutes, 1, 1)}">0.0</span> min
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Per-Counter Breakdown</h5>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Counter</th>
                                    <th class="text-end">Waiting</th>
                                    <th class="text-end">Served</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cs : ${stats.counterStats}">
                                    <td th:text="${cs.counterName}">Counter 1</td>
                                    <td class="text-end" th:text="${cs.waitingCount}">0</td>
                                    <td class="text-end" th:text="${cs.servedToday}">0</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
