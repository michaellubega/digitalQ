<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - digitalQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .current-token { background-color: #d1e7dd; border: 2px solid #198754; }
        .queue-item { transition: background-color 0.3s; }
        .queue-item:hover { background-color: #f8f9fa; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="/staff">
                <span class="fw-bold">digital</span>Q Staff
            </a>
            <div>
                <span class="text-light me-3" th:text="${counter != null ? counter.name : 'No Counter Assigned'}">Counter 1</span>
                <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Left Panel: Current Token & Actions -->
            <div class="col-md-4">
                <!-- Current Token Card -->
                <div class="card shadow mb-4" th:if="${counter != null && counter.currentToken != null}">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Currently Serving</h5>
                    </div>
                    <div class="card-body text-center current-token">
                        <h2 class="display-5 fw-bold" th:text="${counter.currentToken}">A-001</h2>
                        <p class="text-muted mb-2" th:text="${currentCustomerName}">Customer Name</p>
                        <button class="btn btn-success btn-lg w-100" onclick="finishToken()">
                            Finish Token
                        </button>
                    </div>
                </div>

                <!-- No Current Token -->
                <div class="card shadow mb-4" th:if="${counter != null && counter.currentToken == null}">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">Currently Serving</h5>
                    </div>
                    <div class="card-body text-center">
                        <p class="text-muted mb-0">No token currently assigned</p>
                        <button class="btn btn-primary w-100 mt-3" th:if="${counter != null && !waitingTokens.isEmpty()}" onclick="callNextToken()">
                            Call Next Token
                        </button>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="card shadow">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-warning w-100 mb-2" th:if="${counter != null && !counter.paused}" onclick="pauseCounter()">
                            Pause Counter
                        </button>
                        <button class="btn btn-info w-100 mb-2" th:if="${counter != null && counter.paused}" onclick="resumeCounter()">
                            Resume Counter
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Waiting Queue -->
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Waiting Queue</h5>
                        <span class="badge bg-light text-dark" th:text="${waitingTokens.size()}">0</span>
                    </div>
                    <div class="card-body">
                        <div th:if="${counter == null}" class="alert alert-warning">
                            No counter assigned to your account.
                        </div>
                        <div th:if="${counter != null && waitingTokens.isEmpty()}" class="alert alert-info">
                            No customers waiting in queue.
                        </div>
                        <div class="table-responsive" th:if="${counter != null && !waitingTokens.isEmpty()}">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Position</th>
                                        <th>Token</th>
                                        <th>Customer</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="token, iter : ${waitingTokens}" class="queue-item">
                                        <td th:text="${iter.index + 1}">1</td>
                                        <td th:text="${token.tokenNumber}">A-001</td>
                                        <td th:text="${token.customerName}">John</td>
                                        <td>
                                            <span class="badge bg-warning text-dark">Pending</span>
                                        </td>
                                        <td>
                                            <button class="btn btn-sm btn-success" onclick="callNextToken()">
                                                Call
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/staff.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const counterId = /*[[${counter != null ? counter.id : 0}]]*/ 0;
        /*]]>*/
    </script>
</body>
</html>
