<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Token - digitalQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .status-pending { background-color: #fff3cd; border-color: #ffc107; color: #664d03; }
        .status-called { background-color: #d1e7dd; border-color: #198754; color: #0f5132; }
        .status-closed { background-color: #f8d7da; border-color: #dc3545; color: #842029; }
        .status-badge { font-size: 1.2rem; padding: 0.5rem 1rem; border-radius: 2rem; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="fw-bold">digital</span>Q
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4 text-center">
                        <h3 class="card-title">Your Token</h3>

                        <div class="my-4">
                            <h1 class="display-4 fw-bold text-primary" th:text="${token.tokenNumber}">A-001</h1>
                        </div>

                        <div class="mb-4">
                            <img th:src="${token.qrCodeBase64}" alt="QR Code" class="img-fluid" style="max-width: 200px;">
                        </div>

                        <!-- Status Badge -->
                        <div class="mb-3">
                            <span class="badge status-badge"
                                  th:classappend="${token.status == 'WAITING' ? 'bg-warning text-dark' : (token.status == 'CALLED' ? 'bg-success' : 'bg-danger')}"
                                  th:text="${token.status == 'WAITING' ? 'Pending' : (token.status == 'CALLED' ? 'Called' : 'Closed')}">
                                Pending
                            </span>
                        </div>

                        <!-- Status Message -->
                        <div class="alert" th:classappend="${token.status == 'WAITING' ? 'alert-warning' : (token.status == 'CALLED' ? 'alert-success' : 'alert-danger')}">
                            <h5 class="alert-heading">
                                <span th:if="${token.status == 'WAITING'}">Please wait for your turn</span>
                                <span th:if="${token.status == 'CALLED'}">Your turn! Please proceed to the counter</span>
                                <span th:if="${token.status == 'SERVED'}">Thank you! Your token has been served</span>
                                <span th:if="${token.status == 'EXPIRED'}">Your token has expired</span>
                            </h5>
                            <p class="mb-0" th:if="${token.status == 'WAITING'}">
                                Position in queue: <strong th:text="${token.position}">1</strong>
                            </p>
                            <p class="mb-0" th:if="${token.status == 'CALLED'}">
                                Please proceed to the counter now
                            </p>
                        </div>

                        <p class="text-muted">
                            Customer: <strong th:text="${token.customerName}">John</strong>
                        </p>
                        <p class="text-muted">
                            Created: <span th:text="${#temporals.format(token.createdAt, 'HH:mm:ss')}">10:00:00</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/token-status.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const tokenNumber = /*[[${token.tokenNumber}]]*/ '';
        const counterId = /*[[${token.counterId}]]*/ 0;
        /*]]>*/
    </script>
</body>
</html>
