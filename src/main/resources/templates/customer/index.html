<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>digitalQ - Get Token</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="fw-bold">digital</span>Q
            </a>
            <a href="/login" class="btn btn-outline-light btn-sm">Staff Login</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">Get Your Token</h3>
                        <p class="text-muted text-center">Fill in your details to join the queue</p>

                        <form id="tokenForm">
                            <div class="mb-3">
                                <label for="customerName" class="form-label">Your Name</label>
                                <input type="text" class="form-control" id="customerName" name="customerName"
                                       placeholder="Enter your full name" required minlength="2" maxlength="50">
                            </div>
                            <div class="mb-3">
                                <label for="counterId" class="form-label">Service Type</label>
                                <select class="form-select" id="counterId" name="counterId" required>
                                    <option value="" selected disabled>Select a service</option>
                                    <option th:each="counter : ${counters}"
                                            th:value="${counter.id}"
                                            th:text="${counter.name + ' - ' + counter.serviceType}">
                                    </option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg">Get Token</button>
                        </form>

                        <div id="errorAlert" class="alert alert-danger mt-3 d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/customer.js}"></script>
</body>
</html>
